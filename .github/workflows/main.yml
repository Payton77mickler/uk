name: Build Kiln installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build client mod
        continue-on-error: true
        working-directory: kiln-client
        run: gradle build

      - name: Bundle client mod
        shell: bash
        run: cp kiln-client/build/libs/kiln-client-0.1.0.jar kiln/resources/kiln-client.jar || echo "No client mod jar"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build installer
        working-directory: kiln
        run: |
          npm install
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Kiln-Installer
          path: kiln/dist/*.exe
