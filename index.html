<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Kiln</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div><div id="shade"></div>

<section id="login" hidden>
  <div class="login-card">
    <svg class="logo xl" viewBox="0 0 24 24"><use href="#flame"/></svg>
    <h1>Kiln</h1>
    <p>Sign in with your Microsoft account to play.</p>
    <button class="btn lg" id="loginbtn">Sign in with Microsoft</button>
    <div class="muted small" id="loginmsg"></div>
  </div>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><svg class="logo" viewBox="0 0 24 24"><use href="#flame"/></svg><span>Kiln</span></div>
    <nav id="nav"></nav>
    <div id="account"></div>
  </aside>
  <section id="main">
    <header id="top">
      <h1 id="title"></h1>
      <div class="grow"></div>
      <select id="instsel" aria-label="Active instance"></select>
      <button class="btn" id="playbtn"></button>
    </header>
    <div id="update" class="banner" hidden></div>
    <div id="view"></div>
  </section>
</div>

<div id="dock" hidden>
  <div class="row between"><span id="dstatus"></span><button class="link" id="dlog">Log</button></div>
  <div class="bar"><i id="prog"></i></div>
  <pre id="log" hidden></pre>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="flame" viewBox="0 0 24 24"><path d="M12 1.5C12 1.5 5 8.7 5 14a7 7 0 0 0 14 0C19 8.7 12 1.5 12 1.5Z" fill="currentColor"/><path d="M12 11c0 0-3 3-3 5.2a3 3 0 0 0 6 0C15 14 12 11 12 11Z" fill="#ffd678"/></symbol>
  </defs>
</svg>
<script src="app.js"></script>
</body>
</html>
